# LDAP scenarios for ad-remove-from-group action
action:
  params:
    baseDN: DC=corp,DC=example,DC=com
    samAccountName: jdoe
    groupDN: CN=Test Group,OU=Groups,DC=corp,DC=example,DC=com
    dry_run: false
  context:
    secrets:
      BASIC_USERNAME: CN=svc-sgnl,OU=Service Accounts,DC=corp,DC=example,DC=com
      BASIC_PASSWORD: test-password
    environment:
      ADDRESS: ldaps://ad.corp.example.com:636

scenarios:
  - name: successfully remove user from group
    steps:
      - ldap:
          operation: bind
          bindDN: CN=svc-sgnl,OU=Service Accounts,DC=corp,DC=example,DC=com
          password: "[MASKED]"
        fixture: fixtures/200-bind-success.ldap
      - ldap:
          operation: search
          baseDN: DC=corp,DC=example,DC=com
          scope: sub
          filter: (&(|(objectClass=user)(objectClass=group))(sAMAccountName=jdoe))
          attributes: [distinguishedName]
        fixture: fixtures/200-search-success.ldap
      - ldap:
          operation: modify
          dn: CN=Test Group,OU=Groups,DC=corp,DC=example,DC=com
          changes:
            - operation: delete
              modification:
                member: [CN=John Doe,OU=Users,DC=corp,DC=example,DC=com]
        fixture: fixtures/200-modify-success.ldap
      - ldap:
          operation: unbind
        fixture: fixtures/200-unbind-success.ldap
    invoke:
      returns:
        status: success
        memberDN: CN=John Doe,OU=Users,DC=corp,DC=example,DC=com
        userDN: CN=John Doe,OU=Users,DC=corp,DC=example,DC=com
        groupDN: CN=Test Group,OU=Groups,DC=corp,DC=example,DC=com
        removed: true
        address: ldaps://ad.corp.example.com:636
        baseDN: DC=corp,DC=example,DC=com
        samAccountName: jdoe

  - name: successfully remove group from group
    params:
      samAccountName: NestedGroup
      groupDN: CN=Parent Group,OU=Groups,DC=corp,DC=example,DC=com
    steps:
      - ldap:
          operation: bind
          bindDN: CN=svc-sgnl,OU=Service Accounts,DC=corp,DC=example,DC=com
          password: "[MASKED]"
        fixture: fixtures/200-bind-success.ldap
      - ldap:
          operation: search
          baseDN: DC=corp,DC=example,DC=com
          scope: sub
          filter: (&(|(objectClass=user)(objectClass=group))(sAMAccountName=NestedGroup))
          attributes: [distinguishedName]
        fixture: fixtures/200-search-success.ldap
      - ldap:
          operation: modify
          dn: CN=Parent Group,OU=Groups,DC=corp,DC=example,DC=com
          changes:
            - operation: delete
              modification:
                member: [CN=John Doe,OU=Users,DC=corp,DC=example,DC=com]
        fixture: fixtures/200-modify-success.ldap
      - ldap:
          operation: unbind
        fixture: fixtures/200-unbind-success.ldap
    invoke:
      returns:
        status: success
        memberDN: CN=John Doe,OU=Users,DC=corp,DC=example,DC=com
        userDN: CN=John Doe,OU=Users,DC=corp,DC=example,DC=com
        groupDN: CN=Parent Group,OU=Groups,DC=corp,DC=example,DC=com
        removed: true
        address: ldaps://ad.corp.example.com:636
        baseDN: DC=corp,DC=example,DC=com
        samAccountName: NestedGroup

  - name: member not in group - treat as success
    steps:
      - ldap:
          operation: bind
          bindDN: CN=svc-sgnl,OU=Service Accounts,DC=corp,DC=example,DC=com
          password: "[MASKED]"
        fixture: fixtures/200-bind-success.ldap
      - ldap:
          operation: search
          baseDN: DC=corp,DC=example,DC=com
          scope: sub
          filter: (&(|(objectClass=user)(objectClass=group))(sAMAccountName=jdoe))
          attributes: [distinguishedName]
        fixture: fixtures/200-search-success.ldap
      - ldap:
          operation: modify
          dn: CN=Test Group,OU=Groups,DC=corp,DC=example,DC=com
          changes:
            - operation: delete
              modification:
                member: [CN=John Doe,OU=Users,DC=corp,DC=example,DC=com]
        fixture: fixtures/16-modify-not-member.ldap
      - ldap:
          operation: unbind
        fixture: fixtures/200-unbind-success.ldap
    invoke:
      returns:
        status: success
        memberDN: CN=John Doe,OU=Users,DC=corp,DC=example,DC=com
        userDN: CN=John Doe,OU=Users,DC=corp,DC=example,DC=com
        groupDN: CN=Test Group,OU=Groups,DC=corp,DC=example,DC=com
        removed: false
        message: Member is not in the group
        address: ldaps://ad.corp.example.com:636
        baseDN: DC=corp,DC=example,DC=com
        samAccountName: jdoe

  - name: member not found
    steps:
      - ldap:
          operation: bind
          bindDN: CN=svc-sgnl,OU=Service Accounts,DC=corp,DC=example,DC=com
          password: "[MASKED]"
        fixture: fixtures/200-bind-success.ldap
      - ldap:
          operation: search
          baseDN: DC=corp,DC=example,DC=com
          scope: sub
          filter: (&(|(objectClass=user)(objectClass=group))(sAMAccountName=jdoe))
          attributes: [distinguishedName]
        fixture: fixtures/200-search-no-results.ldap
      - ldap:
          operation: unbind
        fixture: fixtures/200-unbind-success.ldap
    invoke:
      throws: "Member not found with sAMAccountName: jdoe"
    error:
      throws: "Member not found"

  - name: multiple members found with same sAMAccountName
    steps:
      - ldap:
          operation: bind
          bindDN: CN=svc-sgnl,OU=Service Accounts,DC=corp,DC=example,DC=com
          password: "[MASKED]"
        fixture: fixtures/200-bind-success.ldap
      - ldap:
          operation: search
          baseDN: DC=corp,DC=example,DC=com
          scope: sub
          filter: (&(|(objectClass=user)(objectClass=group))(sAMAccountName=jdoe))
          attributes: [distinguishedName]
        fixture: fixtures/200-search-multiple-results.ldap
      - ldap:
          operation: unbind
        fixture: fixtures/200-unbind-success.ldap
    invoke:
      throws: "Multiple members found with sAMAccountName: jdoe"
    error:
      throws: "Multiple members found"

  - name: authentication failed
    steps:
      - ldap:
          operation: bind
          bindDN: CN=svc-sgnl,OU=Service Accounts,DC=corp,DC=example,DC=com
          password: "[MASKED]"
        fixture: fixtures/49-bind-error.ldap
    invoke:
      throws: "Invalid credentials"
    error:
      throws: "LDAP authentication failed"

  - name: group not found
    steps:
      - ldap:
          operation: bind
          bindDN: CN=svc-sgnl,OU=Service Accounts,DC=corp,DC=example,DC=com
          password: "[MASKED]"
        fixture: fixtures/200-bind-success.ldap
      - ldap:
          operation: search
          baseDN: DC=corp,DC=example,DC=com
          scope: sub
          filter: (&(|(objectClass=user)(objectClass=group))(sAMAccountName=jdoe))
          attributes: [distinguishedName]
        fixture: fixtures/200-search-success.ldap
      - ldap:
          operation: modify
          dn: CN=Nonexistent Group,OU=Groups,DC=corp,DC=example,DC=com
          changes:
            - operation: delete
              modification:
                member: [CN=John Doe,OU=Users,DC=corp,DC=example,DC=com]
        fixture: fixtures/32-modify-group-not-found.ldap
      - ldap:
          operation: unbind
        fixture: fixtures/200-unbind-success.ldap
    params:
      groupDN: CN=Nonexistent Group,OU=Groups,DC=corp,DC=example,DC=com
    invoke:
      throws: "No Such Object"
    error:
      throws: "Resource not found"

  - name: insufficient permissions to modify group
    steps:
      - ldap:
          operation: bind
          bindDN: CN=svc-sgnl,OU=Service Accounts,DC=corp,DC=example,DC=com
          password: "[MASKED]"
        fixture: fixtures/200-bind-success.ldap
      - ldap:
          operation: search
          baseDN: DC=corp,DC=example,DC=com
          scope: sub
          filter: (&(|(objectClass=user)(objectClass=group))(sAMAccountName=jdoe))
          attributes: [distinguishedName]
        fixture: fixtures/200-search-success.ldap
      - ldap:
          operation: modify
          dn: CN=Test Group,OU=Groups,DC=corp,DC=example,DC=com
          changes:
            - operation: delete
              modification:
                member: [CN=John Doe,OU=Users,DC=corp,DC=example,DC=com]
        fixture: fixtures/50-modify-insufficient-permissions.ldap
      - ldap:
          operation: unbind
        fixture: fixtures/200-unbind-success.ldap
    invoke:
      throws: "Insufficient access rights"
    error:
      throws: "Insufficient LDAP permissions"

  - name: dry run mode - validate parameters without making changes
    params:
      dry_run: true
    steps: []
    invoke:
      returns:
        status: dry_run_completed
        baseDN: DC=corp,DC=example,DC=com
        samAccountName: jdoe
        memberDN: null
        userDN: null
        groupDN: CN=Test Group,OU=Groups,DC=corp,DC=example,DC=com
        removed: false

  - name: missing required parameters
    params:
      baseDN: ""
      samAccountName: jdoe
      groupDN: CN=Test Group,OU=Groups,DC=corp,DC=example,DC=com
    steps: []  # No LDAP operations due to validation failure
    invoke:
      throws: "baseDN is required"

  - name: special characters in sAMAccountName (escape testing)
    params:
      samAccountName: domain\\user*special
    steps:
      - ldap:
          operation: bind
          bindDN: CN=svc-sgnl,OU=Service Accounts,DC=corp,DC=example,DC=com
          password: "[MASKED]"
        fixture: fixtures/200-bind-success.ldap
      - ldap:
          operation: search
          baseDN: DC=corp,DC=example,DC=com
          scope: sub
          filter: (&(|(objectClass=user)(objectClass=group))(sAMAccountName=domain\\5cuser\\2aspecial))
          attributes: [distinguishedName]
        fixture: fixtures/200-search-success.ldap
      - ldap:
          operation: modify
          dn: CN=Test Group,OU=Groups,DC=corp,DC=example,DC=com
          changes:
            - operation: delete
              modification:
                member: [CN=John Doe,OU=Users,DC=corp,DC=example,DC=com]
        fixture: fixtures/200-modify-success.ldap
      - ldap:
          operation: unbind
        fixture: fixtures/200-unbind-success.ldap
    invoke:
      returns:
        status: success
        memberDN: CN=John Doe,OU=Users,DC=corp,DC=example,DC=com
        userDN: CN=John Doe,OU=Users,DC=corp,DC=example,DC=com
        groupDN: CN=Test Group,OU=Groups,DC=corp,DC=example,DC=com
        removed: true
        baseDN: DC=corp,DC=example,DC=com
        samAccountName: domain\\user*special

  - name: idempotent removal - remove member twice (first call should succeed)
    steps:
      # First removal - should succeed
      - ldap:
          operation: bind
          bindDN: CN=svc-sgnl,OU=Service Accounts,DC=corp,DC=example,DC=com
          password: "[MASKED]"
        fixture: fixtures/200-bind-success.ldap
      - ldap:
          operation: search
          baseDN: DC=corp,DC=example,DC=com
          scope: sub
          filter: (&(|(objectClass=user)(objectClass=group))(sAMAccountName=jdoe))
          attributes: [distinguishedName]
        fixture: fixtures/200-search-success.ldap
      - ldap:
          operation: modify
          dn: CN=Test Group,OU=Groups,DC=corp,DC=example,DC=com
          changes:
            - operation: delete
              modification:
                member: [CN=John Doe,OU=Users,DC=corp,DC=example,DC=com]
        fixture: fixtures/200-modify-success.ldap
      - ldap:
          operation: unbind
        fixture: fixtures/200-unbind-success.ldap
    invoke:
      returns:
        status: success
        memberDN: CN=John Doe,OU=Users,DC=corp,DC=example,DC=com
        userDN: CN=John Doe,OU=Users,DC=corp,DC=example,DC=com
        groupDN: CN=Test Group,OU=Groups,DC=corp,DC=example,DC=com
        removed: true
        address: ldaps://ad.corp.example.com:636
        baseDN: DC=corp,DC=example,DC=com
        samAccountName: jdoe

  - name: idempotent removal - second call should succeed with not a member
    steps:
      # Second removal - member already removed, should succeed
      - ldap:
          operation: bind
          bindDN: CN=svc-sgnl,OU=Service Accounts,DC=corp,DC=example,DC=com
          password: "[MASKED]"
        fixture: fixtures/200-bind-success.ldap
      - ldap:
          operation: search
          baseDN: DC=corp,DC=example,DC=com
          scope: sub
          filter: (&(|(objectClass=user)(objectClass=group))(sAMAccountName=jdoe))
          attributes: [distinguishedName]
        fixture: fixtures/200-search-success.ldap
      - ldap:
          operation: modify
          dn: CN=Test Group,OU=Groups,DC=corp,DC=example,DC=com
          changes:
            - operation: delete
              modification:
                member: [CN=John Doe,OU=Users,DC=corp,DC=example,DC=com]
        fixture: fixtures/16-modify-not-member.ldap
      - ldap:
          operation: unbind
        fixture: fixtures/200-unbind-success.ldap
    invoke:
      returns:
        status: success
        memberDN: CN=John Doe,OU=Users,DC=corp,DC=example,DC=com
        userDN: CN=John Doe,OU=Users,DC=corp,DC=example,DC=com
        groupDN: CN=Test Group,OU=Groups,DC=corp,DC=example,DC=com
        removed: false
        message: Member is not in the group
        address: ldaps://ad.corp.example.com:636
        baseDN: DC=corp,DC=example,DC=com
        samAccountName: jdoe

  - name: server unwilling to perform - member not in group (error code 53)
    steps:
      - ldap:
          operation: bind
          bindDN: CN=svc-sgnl,OU=Service Accounts,DC=corp,DC=example,DC=com
          password: "[MASKED]"
        fixture: fixtures/200-bind-success.ldap
      - ldap:
          operation: search
          baseDN: DC=corp,DC=example,DC=com
          scope: sub
          filter: (&(|(objectClass=user)(objectClass=group))(sAMAccountName=jdoe))
          attributes: [distinguishedName]
        fixture: fixtures/200-search-success.ldap
      - ldap:
          operation: modify
          dn: CN=Test Group,OU=Groups,DC=corp,DC=example,DC=com
          changes:
            - operation: delete
              modification:
                member: [CN=John Doe,OU=Users,DC=corp,DC=example,DC=com]
        fixture: fixtures/53-modify-unwilling-to-perform.ldap
      - ldap:
          operation: unbind
        fixture: fixtures/200-unbind-success.ldap
    invoke:
      returns:
        status: success
        memberDN: CN=John Doe,OU=Users,DC=corp,DC=example,DC=com
        userDN: CN=John Doe,OU=Users,DC=corp,DC=example,DC=com
        groupDN: CN=Test Group,OU=Groups,DC=corp,DC=example,DC=com
        removed: false
        message: Member is not in the group
        address: ldaps://ad.corp.example.com:636
        baseDN: DC=corp,DC=example,DC=com
        samAccountName: jdoe
